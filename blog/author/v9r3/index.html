  for(const c of [cDark,cFly,cBook,cAdd]){c.width=Math.round(VW*DPR);c.height=Math.round(VH*DPR);}
  PORT=VH>VW*1.05;
  setVideo(PORT?'portrait':'1280');
  document.documentElement.style.setProperty('--bgx',PORT?'0%':'50%');
  // 세로 배경 = 원본 사진 x 300~940(노을빛 하늘·기둥·용설란). 원본에 구운 AURUM 로고(x 60~255)는 이 범위 밖
  const SW=PORT?640:1920, s=Math.max(VW/SW,VH/1080); BG={s,x:PORT?-300*s:(VW-SW*s)*0.5,y:(VH-1080*s)*0.5};
  const [ux,uy,uw,uh]=UNION; let f={...BG}; f.x=(VW-1920*s)*0.5;
  const m=Math.min(f.x+f.s*ux, VW-(f.x+f.s*(ux+uw)))/VW, mv=Math.min(f.y+f.s*uy, VH-(f.y+f.s*(uy+uh)))/VH;
  if(!PORT&&(m<0.03||mv<0.025)){ const s2=Math.min(f.s,0.95*VH/uh,0.94*VW/uw), cx=SB[0]+SB[2]/2, cy=SB[1]+SB[3]/2;
    let x=f.x+f.s*cx-s2*cx, y=f.y+f.s*cy-s2*cy; y=Math.min(Math.max(y,VH*0.025-s2*uy),VH*0.975-s2*(uy+uh)); f={s:s2,x,y}; }
  FG_LAND=f;
  const coarse=matchMedia('(pointer: coarse)').matches;
  hint.textContent=coarse?'화면을 누르거나 옆으로 밀어 넘겨 보세요':'화면을 누르거나 → 키로 넘겨 보세요';
  hint.className='ui '+(PORT?'tall':'wide')+(hint.classList.contains('on')?' on':'');
  if(!PORT) hint.style.top='';
  if(cam) cam={from:camNow(),to:camNow(),t0:0,dur:1};
  dirty=true; setCount();
}
// ---------- 종이 위 글(실제 글자) ----------
const SVGNS='http://www.w3.org/2000/svg'; const pageEls=[[],[],[]];
for(const pg of LINES.pages){ for(const ln of pg.lines){ const H=ln.H;
  const d=document.createElement('div'); d.className='line';
  d.style.width=ln.w+'px'; d.style.height=ln.h+'px';
  d.style.transform=`matrix3d(${H[0][0]},${H[1][0]},0,${H[2][0]},${H[0][1]},${H[1][1]},0,${H[2][1]},0,0,1,0,${H[0][2]},${H[1][2]},0,${H[2][2]})`;
  const sv=document.createElementNS(SVGNS,'svg'); sv.setAttribute('width',ln.w); sv.setAttribute('height',ln.h); sv.setAttribute('viewBox',`0 0 ${ln.w} ${ln.h}`);
  const tx=document.createElementNS(SVGNS,'text'); tx.setAttribute('font-size',ln.size); tx.setAttribute('style','font-kerning:none');
  for(const c of ln.ch){ const t=document.createElementNS(SVGNS,'tspan'); t.setAttribute('x',(c.x-ln.ox).toFixed(2)); t.setAttribute('y',(c.y-ln.oy).toFixed(2)); t.setAttribute('font-family',c.f); t.textContent=c.c; tx.appendChild(t); }
  sv.appendChild(tx); d.appendChild(sv); d.hidden=true; words.appendChild(d); pageEls[pg.spread].push(d); } }
{ const r=$('#read'); for(let s=0;s<3;s++){ const sec=document.createElement('section'); sec.setAttribute('aria-label',(s+1)+'면');
  for(const pg of LINES.pages.filter(p=>p.spread===s)) for(const ln of pg.lines){ const p=document.createElement(ln.kind[0]==='h'?'h2':'p'); p.textContent=ln.text; sec.appendChild(p);} r.appendChild(sec);} }
function showWords(s){ pageEls.forEach((els,i)=>els.forEach(e=>e.hidden=(i!==s))); }
let wOp=-1; function wordsOpacity(p){ p=Math.round(p*100)/100; if(p!==wOp){ words.style.opacity=p; wOp=p; } }
let lastT=''; function applyFG(){ const t=`translate(${FG.x}px,${FG.y}px) scale(${FG.s})`; if(t!==lastT){ words.style.transform=t; lastT=t; return true;} return false; }
// ---------- 반딧불 ----------
function drawFlies(t){
  ctxF.setTransform(1,0,0,1,0,0); ctxF.clearRect(0,0,cFly.width,cFly.height);
  const k=DPR*BG.s; ctxF.setTransform(k,0,0,k,DPR*BG.x,DPR*BG.y);
  const dim=t<14?1:0.6;
  for(let i=0;i<FF.T0.length;i++){ const on=ss((t-FF.T0[i])/1.2); if(on<=0) continue;
    const tt=t-FF.T0[i], dr=ss(tt/3), ph=FF.PH[i];
    const bx=FF.SRC[i][0]*(1-dr)+FF.FF0[i][0]*dr, by=FF.SRC[i][1]*(1-dr)+FF.FF0[i][1]*dr;
    const x=bx+38*Math.sin(.31*t+ph[0])+17*Math.sin(.83*t+ph[1]), y=by+26*Math.sin(.27*t+ph[2])+11*Math.cos(.71*t+ph[3]);
    const br=on*(.55+.45*Math.sin(2*Math.PI*t/FF.P[i]+ph[0])**2)*dim;
    for(const [pk,sg] of [[.55,1.6],[.05,7]]){ const a=br*pk, R=sg*3; const g=ctxF.createRadialGradient(x,y,0,x,y,R);
      for(let j=0;j<=6;j++){ const r=j/6, v=a*Math.exp(-((r*R)**2)/(2*sg*sg)); g.addColorStop(r,`rgba(${FF.FIRE_RGB[0]},${FF.FIRE_RGB[1]},${FF.FIRE_RGB[2]},${Math.min(1,v)})`);}
      ctxF.fillStyle=g; ctxF.fillRect(x-R,y-R,2*R,2*R);} }
}
// ---------- 그리기 ----------
function stageCtx(ctx,c){ ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,c.width,c.height); const k=DPR*FG.s; ctx.setTransform(k,0,0,k,DPR*FG.x,DPR*FG.y); }
function drawVeil(t){ const env=ss((t-0.2)/0.8)*(1-ss((t-5.6)/1.2)); if(env<=0.002) return;
  ctxD.save(); ctxD.translate(960,470); ctxD.scale(760/420,1);
  const R=420*3.2, g=ctxD.createRadialGradient(0,0,0,0,0,R);
  for(let j=0;j<=16;j++){ const r=j/16, d=r*R/420; g.addColorStop(r,`rgba(0,0,0,${(0.32*env*Math.exp(-d*d)).toFixed(4)})`); }
  ctxD.fillStyle=g; ctxD.fillRect(-R*4,-R*4,R*8,R*8); ctxD.restore(); }
const fxKey=(k,f)=>MAN.fx[f]&&MAN.fx[f][k]?'fx/'+k+pad(f)+'.webp':null;
function drawFx(f){ stageCtx(ctxD,cDark); stageCtx(ctxA,cAdd); if(f<0||f>=FX_N) return true; const e=MAN.fx[f]; let ok=true;
  drawVeil(f/FPS);
  if(e.d){const im=ready(fxKey('d',f)); if(im) ctxD.drawImage(im,...e.d); else ok=false;}
  if(e.a){const im=ready(fxKey('a',f)); if(im) ctxA.drawImage(im,...e.a); else ok=false;}
  return ok; }
function drawBookFrame(set,f7){ stageCtx(ctxB,cBook); if(f7==null) return true; const im=ready(MAN[set].frames[f7]); if(!im) return false; ctxB.drawImage(im,...MAN[set].box); return true; }
function drawStill(p){ stageCtx(ctxB,cBook); const im=ready('s0_blank.webp'); if(!im) return false; ctxB.drawImage(im,...SB);
  if(p<1){ const k='s'+spread+'_ink', ik=ready(k+'.webp'); if(ik){ ctxB.globalAlpha=1-p; ctxB.drawImage(ik,...MAN.still[k]); ctxB.globalAlpha=1; } }
  return true; }
function prefetch(keys){ for(const k of keys) ensure(k); }
// ---------- 흐름 ----------
let mode='wait', spread=0, side=0, clock=0, last=0, turn=null, pan=null, pending=0, dirty=true, started=false, hinted=false, cam=null;
function camNow(now){ if(!cam) return camPage(side); const p=ss(((now??performance.now())-cam.t0)/cam.dur); return lerpCam(cam.from,cam.to,p); }
function setCam(to,dur,now){ cam={from:cam?camNow(now):to,to,t0:now??performance.now(),dur:Math.max(1,dur)}; }
function setCount(){ count.textContent=PORT?(spread*2+side+1)+' / 6':(spread+1)+' / 3'; }
let restT0=0;
function rest(){ mode='rest'; turn=null; pan=null; restT0=performance.now(); drawFx(-1); showWords(spread); setCount(); count.classList.add('on');
  if(!hinted){hint.classList.add('on');} if(pending){const d=pending; pending=0; go(d);} }
let lastTurnMs=0, turnStart=0;
function startTurn(dir,now){ turnStart=now; const to=spread+dir; const [a,b]=TURNS[dir>0?spread:to]; turn={to,dir,a,b,t0:now}; mode='turn';
  if(PORT){ setCam(camPage(dir>0?0:1),TURN_MS*0.92,now+TURN_MS*0.06); } }      // 세로: 넘어가는 낱장을 따라 오른쪽 면 → 다음 장 왼쪽 면(거꾸로면 반대)
function go(dir){
  if(mode==='turn'||mode==='pan'){ pending=dir; return; }
  if(mode!=='rest') return;
  const now=performance.now();
  if(!hinted){hinted=true; hint.classList.remove('on');}
  if(PORT){
    if(dir>0&&side===0){ side=1; mode='pan'; pan={t0:now}; setCam(camPage(1),520,now); setCount(); return; }   // 같은 장 안: 책을 옆으로 미는 이동
    if(dir<0&&side===1){ side=0; mode='pan'; pan={t0:now}; setCam(camPage(0),520,now); setCount(); return; }
  }
  const to=spread+dir; if(to<0||to>2) return;
  startTurn(dir,now);
}
function updateFG(now){ if(!PORT){ FG=FG_LAND; return; }
  if(mode==='open'||mode==='wait'){ // 여는 장면: 로고·표지를 가운데 크게 → 책이 펼쳐지는 동안(영상 11.2~13.4초) 왼쪽 면으로
    const t=clock/1000, p=ss((t-11.2)/2.2); FG=camFG(lerpCam(camOpen(),camPage(0),p)); return; }
  FG=camFG(camNow(now)); }
function placeHint(){ if(!PORT) return; const b=PG.L; hint.style.top=Math.round(FG.y+FG.s*(b[1]+b[3])+Math.max(26,VH*0.035))+'px'; }
function tick(now){
  const dt=last?Math.min(100,now-last):0; last=now;
  updateFG(now); const moved=applyFG();
  if(mode==='open'){
    const f=Math.floor(clock*FPS/1000), f7=f-OFF;
    const ahead=[]; for(let g=f;g<f+16;g++){ ahead.push(fxKey('d',g),fxKey('a',g)); const g7=g-OFF; if(g7>=OPEN0&&g7<=OPEN1) ahead.push(MAN.open.frames[g7]); } prefetch(ahead);
    const okF=drawFx(f); let okB=true; wordsOpacity(0);
    if(f7>=OPEN0&&f7<=OPEN1) okB=drawBookFrame('open',f7); else if(f7<OPEN0) stageCtx(ctxB,cBook);
    drawFlies(clock/1000);
    if(okF&&okB) clock+=dt;
    if(f7>OPEN1){ spread=0; side=0; cam=null; rest(); }
  } else if(mode==='turn'){
    drawFlies((clock+=dt)/1000);
    const n=turn.b-turn.a, i=Math.min(n,Math.floor((now-turn.t0)*FPS/1000));
    const f7=turn.dir>0?turn.a+i:turn.b-i;
    const ahead=[]; for(let j=i;j<i+22&&j<=n;j++) ahead.push(MAN.turn.frames[turn.dir>0?turn.a+j:turn.b-j]); prefetch(ahead);
    if(!drawBookFrame('turn',f7)){ turn.t0+=dt; if(cam) cam.t0+=dt; }
    const q=1-ss((now-turn.t0)/320);
    if(q>0){ const im=ready('s0_blank.webp'); if(im){ ctxB.globalAlpha=q; ctxB.drawImage(im,...SB); ctxB.globalAlpha=1; } }
    wordsOpacity(q);
    if(i>=n){ lastTurnMs=Math.round(now-turnStart); spread=turn.to; side=PORT?(turn.dir>0?0:1):0; rest(); }
  } else if(mode==='pan'||mode==='rest'){
    drawFlies((clock+=dt)/1000);
    if(mode==='pan'&&now-pan.t0>=540){ rest(); }
    const p=mode==='pan'?1:ss((now-restT0)/320);
    if(dirty||moved||p<1||wOp<1){ drawStill(p); wordsOpacity(p); dirty=false; }
    if(mode==='rest'&&now-restT0>360){ const nx=[];                 // 다음·이전 넘김의 첫 16장을 미리 풀어 둠(넘김이 머뭇거리지 않게)
      if(spread<2){ const [a]=TURNS[spread]; for(let j=0;j<16;j++) nx.push(MAN.turn.frames[a+j]); }
      if(spread>0){ const [,b]=TURNS[spread-1]; for(let j=0;j<16;j++) nx.push(MAN.turn.frames[b-j]); }
      prefetch(nx); }
  }
  placeHint();
  requestAnimationFrame(tick);
}
function begin(){
  if(started) return; started=true; $('#load').style.opacity=0;
  if(reduce){ clock=(OFF+OPEN1+1)*1000/FPS; spread=0; rest(); }
  else { mode='open'; clock=0; }
}
// 첫 묶음(정지 면 + 여는 장면 첫 3초)과 글꼴이 오면 시작, 나머지 묶음은 재생하며 이어서 받음
(function waitStart(){ let ok=bundlesDone>=1&&document.fonts.status==='loaded';
  if(ok){ prefetch(['s0_blank.webp','s0_ink.webp']); for(let f=0;f<12;f++){ for(const k of ['d','a']){ const key=fxKey(k,f); if(key&&!ready(key)) ok=false; } } }
  if(ok) begin(); else setTimeout(waitStart,60); })();
video.play&&video.play().catch(()=>{});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) video.play().catch(()=>{}); });
// ---------- 입력 ----------
const scene=$('#scene'); let sx=0,sy=0,touching=false;
scene.addEventListener('pointerdown',e=>{touching=true;sx=e.clientX;sy=e.clientY;});
scene.addEventListener('pointerup',e=>{ if(!touching) return; touching=false; if(e.target.closest('.nav')) return;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)) go(dx<0?1:-1);
  else if(Math.abs(dx)<12&&Math.abs(dy)<12) go(e.clientX<VW*0.22?-1:1); });
$('.nav.prev').addEventListener('click',e=>{e.stopPropagation();go(-1);});
$('.nav.next').addEventListener('click',e=>{e.stopPropagation();go(1);});
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(1);} else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1);} });
addEventListener('resize',()=>{ const want=(innerHeight>innerWidth*1.05)?'port':'land'; if(want!==SET){ location.reload(); return; } layout(); }); layout(); requestAnimationFrame(tick);
window.__state=()=>({SET,lastTurnMs,mode,spread,side,clock,FG,BG,UNION,SB,PORT,PG,bundlesDone,nbundles:MAN.bundles.length,decoded:imgs.size});
window.__dbg=p=>{mode='dbg'; drawStill(p); wordsOpacity(p);};
</script>
